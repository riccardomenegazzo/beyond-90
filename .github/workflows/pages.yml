name: Pages
on:
  push:
    branches: [main]
    paths: ["site/**", "src/**", "examples/**", "THIRD_PARTY.md", "LICENSE", ".github/workflows/pages.yml"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      # Pyodide is served from the same origin as the page; nothing is loaded from a CDN at run time.
      - run: npm ci --ignore-scripts --prefix site/npm
      - run: node --test site/test/*.test.mjs
      - run: python site/build_site.py --out _site --pyodide site/npm/node_modules/pyodide
      - run: python -m pip install playwright && python -m playwright install --with-deps chromium
      - run: python site/e2e.py _site
        env:
          AXE_CORE: site/npm/node_modules/axe-core/axe.min.js
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
