name: Pages
on:
  push:
    branches: [main]
    paths: ["site/**", "src/**", "examples/**", "THIRD_PARTY.md", "LICENSE", ".github/workflows/pages.yml"]
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * *"     # the cloud security news, read again every morning
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      # Pyodide is served from the same origin as the page; nothing is loaded from a CDN at run time.
      - run: npm ci --ignore-scripts --prefix site/npm
      - run: node --test site/test/*.test.mjs
      # Public sources only, no token. A source that fails is reported in the feed; if all fail, the site ships without one.
      - name: Collect cloud security news
        run: |
          python -m pip install --no-deps .
          curl -fsS --max-time 30 "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/feed/advisories.json" -o previous-feed.json || rm -f previous-feed.json
          beyond90 feeds --previous previous-feed.json --out feed.json || rm -f feed.json
          if [ -f feed.json ]; then
            python -c "import json, beyond90.feeds as f; print(f.render_markdown(json.load(open('feed.json')), limit=40))" | tee -a "$GITHUB_STEP_SUMMARY"
          fi
      - run: python site/build_site.py --out _site --pyodide site/npm/node_modules/pyodide $( [ -f feed.json ] && echo --feed feed.json )
      - run: python -m pip install playwright && python -m playwright install --with-deps chromium
      - run: python site/e2e.py _site
        env:
          AXE_CORE: site/npm/node_modules/axe-core/axe.min.js
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
