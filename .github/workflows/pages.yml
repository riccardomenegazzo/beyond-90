name: Pages
on:
  push:
    branches: [main]
    paths: ["site/**", "src/**", "examples/**", "requirements/**", "THIRD_PARTY.md", "LICENSE", ".github/workflows/pages.yml"]
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * *"     # the cloud security news, read again every morning
permissions: {}
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      # Pyodide is served from the same origin as the page; nothing is loaded from a CDN at run time.
      - run: npm ci --ignore-scripts --prefix site/npm
      - run: node --test site/test/*.test.mjs
      # Public sources only, no token. A source that fails is reported in the feed; if all fail, the site ships without one.
      - name: Collect cloud security news
        env:
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
        run: |
          python -m pip install --no-deps .
          curl -fsS --max-time 30 "https://${OWNER}.github.io/${REPO}/feed/advisories.json" -o previous-feed.json || rm -f previous-feed.json
          beyond90 feeds --previous previous-feed.json --out feed.json || rm -f feed.json
          if [ -f feed.json ]; then
            python -c "import json, beyond90.feeds as f; print(f.render_markdown(json.load(open('feed.json')), limit=40))" | tee -a "$GITHUB_STEP_SUMMARY"
          fi
      - env:
          B90_FORCE_UPDATE: "1"      # this release only: switch installed copies by themselves
        run: python site/build_site.py --out _site --pyodide site/npm/node_modules/pyodide $( [ -f feed.json ] && echo --feed feed.json )
      - run: |
          python -m pip install --require-hashes -r requirements/e2e.txt
          # The package mirrors are sometimes unreachable: try the full install once, and if it fails fall back to the
          # browser alone (the runner image already has the libraries it needs) instead of failing the deploy.
          timeout 240 python -m playwright install --with-deps chromium || python -m playwright install chromium
      - run: python site/e2e.py _site
        env:
          AXE_CORE: site/npm/node_modules/axe-core/axe.min.js
      - run: python site/build_extension.py --site _site --out dist/extension
      - run: python site/e2e_extension.py dist/extension/chrome
      - name: Offer the browser extension and the self-hosted site for download
        run: |
          python -m zipfile -c beyond90-site.zip _site/
          mkdir -p _site/download
          mv beyond90-site.zip _site/download/beyond90-site.zip
          mkdir -p _site/extension
          cp dist/extension/beyond90-chrome-*.zip _site/extension/beyond90-chrome.zip
          cp dist/extension/beyond90-firefox-*.zip _site/extension/beyond90-firefox.zip
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: provenance-subjects
          path: |
            _site/SHA256SUMS
            _site/extension/*.zip
            _site/download/*.zip
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: _site
  attest:
    # signs the manifest of every site file and the extension packages: anyone can prove this workflow built them
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: provenance-subjects
          path: subjects
      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: |
            subjects/SHA256SUMS
            subjects/extension/*.zip
            subjects/download/*.zip
  deploy:
    needs: [build, attest]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
