name: Pages
on:
  push:
    branches: [main]
    paths: ["site/**", "src/**", "examples/**", "THIRD_PARTY.md", "LICENSE", ".github/workflows/pages.yml"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Pyodide is served from the same origin as the page; nothing is loaded from a CDN at run time.
      - run: npm install pyodide@314.0.7 --prefix build/npm
      - run: node --test site/test/*.test.mjs
      - run: python site/build_site.py --out _site --pyodide build/npm/node_modules/pyodide
      - run: python -m pip install playwright && python -m playwright install --with-deps chromium
      - run: npm install axe-core --prefix build/axe
      - run: python site/e2e.py _site
        env:
          AXE_CORE: build/axe/node_modules/axe-core/axe.min.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
