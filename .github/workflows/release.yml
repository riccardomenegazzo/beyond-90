name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build pytest
      - run: python -m pip install -e . && python -m pytest -q
      - run: python -m build
      - name: Check the tag matches the package version
        run: |
          v=$(python -c "import beyond90; print(beyond90.__version__)")
          test "v$v" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} does not match version $v"; exit 1; }
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
