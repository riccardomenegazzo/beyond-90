name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
  id-token: write        # to sign the build provenance
  attestations: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: python -m pip install build pytest
      - run: python -m pip install -e . && python -m pytest -q
      - run: python -m build
      - name: Check the tag matches the package version
        run: |
          v=$(python -c "import beyond90; print(beyond90.__version__)")
          test "v$v" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} does not match version $v"; exit 1; }
      - name: Software bill of materials and checksums
        run: |
          python scripts/sbom.py > dist/sbom.cdx.json
          (cd dist && sha256sum * > SHA256SUMS)
      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: "dist/*"
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: dist/*
          generate_release_notes: true
