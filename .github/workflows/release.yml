name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
  id-token: write        # to sign the build provenance
  attestations: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: python -m pip install build pytest
      - run: python -m pip install -e . && python -m pytest -q
      - run: python -m build
      - name: Check the tag matches the package version
        run: |
          v=$(python -c "import beyond90; print(beyond90.__version__)")
          test "v$v" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} does not match version $v"; exit 1; }
      - name: Software bill of materials and checksums
        run: |
          python scripts/sbom.py > dist/sbom.cdx.json
          (cd dist && sha256sum * > SHA256SUMS)
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "dist/*"
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: dist/*
          generate_release_notes: true
