name: Release
on:
  push:
    tags: ["v*"]
permissions: {}
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: npm ci --ignore-scripts --prefix site/npm      # Pyodide, from the lock file, for the site inside the local download (the runner's own Node: no cache action in a release)
      - run: python -m pip install --require-hashes -r requirements/dev.txt
      - run: python -m pip install --no-deps -e . && python -m pytest -q
      - run: python -m build --no-isolation        # the build backend comes from the hashed lock, not from the index
      - name: Check the tag matches the package version
        run: |
          v=$(python -c "import beyond90; print(beyond90.__version__)")
          test "v$v" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} does not match version $v"; exit 1; }
      - name: The download that runs on any computer, without the public site
        run: |
          python site/build_site.py --out _site --pyodide site/npm/node_modules/pyodide
          python scripts/local_bundle.py _site "dist/beyond90-local-${GITHUB_REF_NAME#v}.zip"
      - name: Software bill of materials and checksums
        run: |
          python scripts/sbom.py > dist/sbom.cdx.json
          (cd dist && sha256sum * > SHA256SUMS)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist
          path: dist/
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write        # to create the release
      id-token: write        # to sign the build provenance
      attestations: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist
          path: dist
      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: "dist/*"
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        # A release made by hand in GitHub's page (which creates the tag) gets the files attached; otherwise it is created here.
        run: |
          if gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" dist/* --repo "${GITHUB_REPOSITORY}" --clobber
          else
            gh release create "${GITHUB_REF_NAME}" dist/* --repo "${GITHUB_REPOSITORY}" --generate-notes --verify-tag
          fi
