name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q
      - name: Smoke test on the example account
        run: |
          beyond90 validate examples/portfolio/northwind
          beyond90 score examples/portfolio/northwind --format text
          beyond90 report examples/portfolio/northwind --out /tmp/report.html
