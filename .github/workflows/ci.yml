name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions: {}
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --require-hashes -r requirements/dev.txt && python -m pip install --no-deps -e .
      - run: python -m pytest -q
      - name: Lint and strict types (once)
        if: matrix.python-version == '3.13'
        run: |
          ruff check src tests examples site scripts
          mypy src
      - name: Smoke test on the example account
        run: |
          beyond90 validate examples/portfolio/northwind
          beyond90 score examples/portfolio/northwind --format text
          beyond90 plan examples/portfolio/northwind --weeks 8
          beyond90 explain examples/portfolio/northwind --since examples/history/northwind-2026-09
          beyond90 report examples/portfolio/northwind --since examples/history/northwind-2026-09 --out /tmp/report.html
          beyond90 exec-qbr examples/portfolio/northwind examples/history/northwind-2026-09 --out /tmp/review.html
      - name: Automatic pipeline against the fake vendor API
        run: |
          python examples/automation/mock_vendor_api.py 8765 &
          sleep 2
          cp examples/automation/beyond90.toml /tmp/beyond90.toml
          cd /tmp
          export VENDOR_TOKEN=demo-token
          beyond90 check-config beyond90.toml
          beyond90 run beyond90.toml --as-of 2026-11-02
          beyond90 run beyond90.toml --as-of 2026-11-09 --no-notify
          test -s state/out/latest/report.html
  site:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - run: npm ci --ignore-scripts --prefix site/npm
      - name: Lint the browser app (no eval, no HTML sinks)
        run: site/npm/node_modules/.bin/eslint --config site/npm/eslint.config.mjs --max-warnings 0 site
      - name: The browser app's data model and vault
        run: node --test site/test/*.test.mjs
  workflows:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - run: python -m pip install --require-hashes -r requirements/audit.txt
      - name: Audit the workflows themselves
        run: zizmor --offline --min-severity low .github/workflows
