name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q
      - name: Lint and types (once)
        if: matrix.python-version == '3.13'
        run: |
          ruff check src tests examples site
          mypy src
      - name: Smoke test on the example account
        run: |
          beyond90 validate examples/portfolio/northwind
          beyond90 score examples/portfolio/northwind --format text
          beyond90 plan examples/portfolio/northwind --weeks 8
          beyond90 explain examples/portfolio/northwind --since examples/history/northwind-2026-09
          beyond90 universe examples/portfolio/northwind
          beyond90 forecast examples/portfolio/northwind
          beyond90 report examples/portfolio/northwind --since examples/history/northwind-2026-09 --out /tmp/report.html
      - name: Automatic pipeline against the fake vendor API
        run: |
          python examples/automation/mock_vendor_api.py 8765 &
          sleep 2
          cp examples/automation/beyond90.toml /tmp/beyond90.toml
          cd /tmp
          export VENDOR_TOKEN=demo-token
          beyond90 check-config beyond90.toml
          beyond90 run beyond90.toml --as-of 2026-11-02
          beyond90 run beyond90.toml --as-of 2026-11-09 --no-notify
          test -s state/out/latest/report.html
  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: The browser app's data model (workspace, fingerprint, merge)
        run: node --test site/test/*.test.mjs
