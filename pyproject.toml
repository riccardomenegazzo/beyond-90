[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "beyond90"
version = "0.34.3"
description = "Adoption engine for Technical Account Managers: a score that cannot be flattered, and an action for every gap."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Riccardo Menegazzo" }]
keywords = ["customer-success", "technical-account-management", "cloud-security", "adoption", "cnapp"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Information Technology",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.10"]

[project.scripts]
beyond90 = "beyond90.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
beyond90 = ["data/*.json", "data/profiles/*/*.json", "py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 140
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "C4", "PIE", "RUF", "S", "T20", "ISC"]
ignore = ["E501", "E741", "SIM108", "B905", "UP007", "UP045", "RUF012"]
allowed-confusables = ["×", "–"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S107", "S108", "S310", "S311", "S603", "S607", "T201"]
"examples/**" = ["S105", "S311", "T201"]
"site/*.py" = ["T201"]
"scripts/*.py" = ["T201"]
"src/beyond90/cli.py" = ["T201"]

[tool.ruff.lint.isort]
known-first-party = ["beyond90"]
known-local-folder = ["helpers"]

[tool.mypy]
python_version = "3.11"
strict = true
